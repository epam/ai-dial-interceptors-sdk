---
excludes:
  scopes:
    - pattern: "dev"
      reason: "DEV_DEPENDENCY_OF"
      comment: "Packages for development only."
    - pattern: "lint"
      reason: "DEV_DEPENDENCY_OF"
      comment: "Packages for static code analysis only."
    - pattern: "test"
      reason: "TEST_DEPENDENCY_OF"
      comment: "Packages for testing only."
    - pattern: "examples"
      reason: "TEST_DEPENDENCY_OF"
      comment: "Packages for examples only."
license_choices:
  repository_license_choices:
    - given: FTL OR GPL-2.0-or-later
      choice: FTL
resolutions:
  rule_violations:
    - message: ".*PyPI::httpcore:1\\.0\\.9.*"
      reason: "CANT_FIX_EXCEPTION"
      comment: "BSD 3-Clause New or Revised License: https://github.com/encode/httpcore/blob/1.0.9/LICENSE.md"
    - message: ".*PyPI::aiostream:0\\.6\\.2.*"
      reason: "CANT_FIX_EXCEPTION"
      comment: "GNU General Public License v3.0: https://github.com/vxgmichel/aiostream/blob/v0.6.2/LICENSE"
    - message: ".*PyPI::httpx:0\\.28\\.1.*"
      reason: "CANT_FIX_EXCEPTION"
      comment: "BSD 3-Clause New or Revised License: https://github.com/encode/httpx/blob/0.28.1/LICENSE.md"
    - message: ".*PyPI::aiohappyeyeballs:2\\.4\\.0.*"
      reason: "CANT_FIX_EXCEPTION"
      comment: "PSF-2.0: https://github.com/aio-libs/aiohappyeyeballs/commit/ca9c1fca4d63c54855fbe582132b5dcb229c7591"
    - message: ".*PyPI::jinja2:3\\.1\\.6.*"
      reason: "CANT_FIX_EXCEPTION"
      comment: "BSD 3-Clause New or Revised License: https://github.com/pallets/jinja/blob/3.1.6/LICENSE.txt"
    - message: ".*PyPI::packaging:24\\.2.*"
      reason: "CANT_FIX_EXCEPTION"
      comment: "Apache and BSD: https://github.com/pypa/packaging/blob/24.2/LICENSE"
    - message: ".*PyPI::setuptools:78\\.1\\.1.*"
      reason: "CANT_FIX_EXCEPTION"
      comment: "MIT License: https://github.com/pypa/setuptools/blob/v78.1.1/LICENSE"
    - message: ".*PyPI::typing-extensions:4\\.14\\.1.*"
      reason: "CANT_FIX_EXCEPTION"
      comment: "Same as CPython: https://github.com/python/typing_extensions/blob/4.14.1/LICENSE"
    - message: ".*PyPI::fastapi:0\\.120\\.2.*"
      reason: "CANT_FIX_EXCEPTION"
      comment: "MIT License: https://github.com/fastapi/fastapi/blob/0.120.2/LICENSE"
    - message: ".*PyPI::starlette:0\\.49\\.1.*"
      reason: "CANT_FIX_EXCEPTION"
      comment: "BSD 3-Clause New or Revised License: https://github.com/Kludex/starlette/blob/0.49.1/LICENSE.md"
    - message: ".*PyPI::opentelemetry.*"
      reason: "CANT_FIX_EXCEPTION"
      comment: "ORT doesn't pickup license information"
    - message: ".*PyPI::typing-extensions.*"
      reason: "CANT_FIX_EXCEPTION"
      comment: "ORT doesn't pickup license information"
    - message: ".*PyPI::grpcio:.*"
      reason: "CANT_FIX_EXCEPTION"
      comment: "ORT doesn't pickup license information"
